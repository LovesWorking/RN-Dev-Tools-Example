# Lefthook configuration for git hooks
# https://lefthook.dev/configuration/

pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{js,ts,jsx,tsx}"
      run: pnpm run lint
      
    validate-imports:
      run: pnpm run validate:imports
      
pre-push:
  parallel: true
  commands:
    typecheck:
      run: pnpm exec tsc --noEmit
      
    test:
      run: pnpm test -- --ci --passWithNoTests
      
    validate-imports:
      run: pnpm run validate:imports